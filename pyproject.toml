[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idlegrid"
version = "0.1.0"
description = "Predictive idle-compute scheduler: harvest idle team laptops for ML workloads"
readme = "README.md"
# PRD target is Python 3.12 on every laptop; newer versions are allowed so local tools keep working.
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6,<3", "psutil>=5.9", "requests>=2.31", "rich>=13.7"]

[project.optional-dependencies]
agent = []
dispatcher = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "optuna>=4.0,<6",
]
ml = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "scipy>=1.12", "joblib>=1.3"]
dev = ["pytest>=8", "pytest-cov", "ruff", "httpx"]

[project.scripts]
gridctl = "idlegrid.cli.gridctl:cli_main"
idlegrid-agent = "idlegrid.agent.__main__:main"
idlegrid-dispatcher = "idlegrid.dispatcher.__main__:main"

[tool.setuptools.packages.find]
include = ["idlegrid*"]

[tool.setuptools.package-data]
"idlegrid.dashboard" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
"idlegrid.agent" = ["default_config.json"]
"idlegrid.db.legacy" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
markers = ["mysql: needs a MySQL server (IDLEGRID_DB_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
